name: Build Pico UF2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'pico_sdk_import.cmake'
      - 'external/TASBot-eye-animations/**'
      - '.github/workflows/build-pico-uf2.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'pico_sdk_import.cmake'
      - 'external/TASBot-eye-animations/**'
      - '.github/workflows/build-pico-uf2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: standard
            build_dir: build/ci-standard
            use_tasbot_index: OFF
            artifact_name: tasbot-eyes-pico-uf2-standard
          - variant_name: tasbot-index-8x28
            build_dir: build/ci-tasbot-index-8x28
            use_tasbot_index: ON
            artifact_name: tasbot-eyes-pico-uf2-tasbot-index-8x28

    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            binutils-arm-none-eabi \
            python3 \
            build-essential \
            git

      - name: Fetch Pico SDK
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --recursive

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DPICO_BOARD=pimoroni_plasma2350 \
            -DTASBOT_ENABLE_ASSET_GENERATION=OFF \
            -DTASBOT_LED_INDEX_USE_TASBOT_8X28=${{ matrix.use_tasbot_index }}

      - name: Build firmware
        run: cmake --build "${{ matrix.build_dir }}" --parallel

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.build_dir }}/tasbot_eyes_pico.uf2
          if-no-files-found: error